<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1B84FF">
    <title>Sem conexão</title>
    <style>
        :root { --bg: #f5f8fa; --card: #ffffff; --text: #181c32; --muted: #7e8299; --primary: #1B84FF; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #151521; --card: #1e1e2d; --text: #f5f8fa; --muted: #a1a5b7; }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        }
        .card { background: var(--card); border-radius: 16px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
        h1 { font-size: 20px; margin: 20px 0 8px; }
        p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
        button { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1B84FF"/><path d="M18 20h28a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H29l-8 7v-7h-3a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z" fill="#fff"/><circle cx="24" cy="32" r="2.6" fill="#1B84FF"/><circle cx="32" cy="32" r="2.6" fill="#1B84FF"/><circle cx="40" cy="32" r="2.6" fill="#1B84FF"/></svg>
        <h1>Sem conexão</h1>
        <p>Não foi possível falar com o servidor. Confira sua internet; o app volta sozinho quando a conexão retornar.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
    <script>
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
